<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
 <style>
   body {
     margin: 0;
     display: flex;
     justify-content: center;
     background-color: #111;
   }
   canvas {
     display: block;
     flex: none;
     width: 100vw;
     height: 3700px;
     background-color: skyblue;
     background: linear-gradient(to top, black, #38bdf8);
   }
 </style>
</head>
<body>
 <canvas id="canvas"></canvas>


 <script>
   const canvas = document.getElementById('canvas');
   const ctx = canvas.getContext('2d');
   let cx = canvas.width
   let cy = canvas.height
   let tall = 3700
    let scroll = 0
   let midscroll = 0
   let scrollProgress = 0
   let maxScroll = 0
   let liney = 0
   let linetarget = 0   
         const fishTypes = [
     { name: "Minnow",      minDepth: 900,  maxDepth: 1400, weight: 100,    size: 14, color: "#94a3b8", finColor: "#cbd5e1", speed: 4.2, type: "normal" },
     { name: "Goldfish",    minDepth: 1000, maxDepth: 1650, weight: 50,     size: 18, color: "#fb923c", finColor: "#ea580c", speed: 3,   type: "normal" },
     { name: "Clownfish",   minDepth: 1200, maxDepth: 1950, weight: 20,     size: 20, color: "#f97316", finColor: "#ffffff", speed: 4.0, type: "striped" },
     { name: "Blue Tang",   minDepth: 1450, maxDepth: 2250, weight: 8,      size: 22, color: "#2563eb", finColor: "#facc15", speed: 4.6, type: "normal" },
     { name: "Pufferfish",  minDepth: 1700, maxDepth: 2550, weight: 2.5,    size: 26, color: "#fde047", finColor: "#ca8a04", speed: 2.2, type: "puffer" },
     { name: "Eel",         minDepth: 1950, maxDepth: 2850, weight: 0.7,    size: 32, color: "#4ade80", finColor: "#16a34a", speed: 4.4, type: "eel" },
     { name: "Swordfish",   minDepth: 2200, maxDepth: 3100, weight: 0.15,   size: 35, color: "#38bdf8", finColor: "#0284c7", speed: 7.5, type: "sword" },
     { name: "Shark",       minDepth: 2450, maxDepth: 3300, weight: 0.03,   size: 42, color: "#64748b", finColor: "#334155", speed: 4,   type: "shark" },
     { name: "Giant Squid", minDepth: 2700, maxDepth: 3380, weight: 0.005,  size: 38, color: "#f43f5e", finColor: "#be123c", speed: 1.7, type: "squid" },
     { name: "Anglerfish",  minDepth: 2950, maxDepth: 3380, weight: 0.0008, size: 34, color: "#581c87", finColor: "#fef08a", speed: 1.4, type: "angler" }
   ];


   let activeFish = null;
   let inWater = false;
   let caughtFish = null;
   let caughtCount = 0;
   let lastCatchText = "";
   let lastCatchTimer = 0;

   function spawnFish() {
     const baseDepth = Math.max(950, liney);
     const targetDepth = Math.max(950, Math.min(3350, baseDepth + (Math.random() * 500 - 100)));
     const available = fishTypes.filter(f => targetDepth >= f.minDepth && targetDepth <= f.maxDepth);
     const pool = available.length > 0 ? available : [fishTypes[fishTypes.length - 1]];

     const totalWeight = pool.reduce((sum, f) => sum + f.weight, 0);
     let roll = Math.random() * totalWeight;
     let chosen = pool[0];

     for (let f of pool) {
       roll -= f.weight;
       if (roll <= 0) {
         chosen = f;
         break;
       }
     }

     const dir = Math.random() < 0.5 ? 1 : -1;
     const startX = dir === 1 ? -60 : (canvas.width || window.innerWidth) + 60;

     activeFish = {
       ...chosen,
       x: startX,
       y: targetDepth,
       dir: dir,
       deep: targetDepth - 325
     };
   }


   function update() {
  
     cx = canvas.width
     cy = canvas.height
    
     //sky
     ctx.clearRect(0, 0, cx, cy);
     ctx.fillStyle = 'skyblue'
     ctx.fillRect(0, 0, cx, 300);
     ctx.fillStyle = 'white'
     ctx.fillRect(0, 300, cx, 5);
    
     //dock
     ctx.fillStyle = 'brown'
     ctx.fillRect(1, 270, 10, 50);
     ctx.fillRect(60, 270, 10, 50);
     ctx.fillRect(120, 270, 10, 50);
     ctx.fillRect(180, 270, 10, 50);
     ctx.fillRect(0, 265, 200, 5);
    
     //player
     ctx.beginPath()
   ctx.lineWidth = 4;
     ctx.fillStyle = 'red'
     ctx.rect(100, 215, 50, 50);
     ctx.fill()
     ctx.stroke();
    
     //fishing rod
     ctx.strokeStyle = 'green'
     ctx.beginPath()
     ctx.moveTo(135, 240);
     ctx.lineTo(200, 120);
     ctx.stroke();
      
      
     
     //I made a usefull function for drawing circles so that we can easaly do it in just one line
     ctx.strokeStyle = 'black'
     circle(170, 190, 7, true, false)
    
     circle(180, 170, 6, true, false)
    
     circle(190, 150, 5, true, false)
    
     circle(200, 130, 4, true, false)
     drawDepth()

     ctx.font = "bold 20px sans-serif";
     ctx.fillStyle = "black";
    // ctx.fillText("Caught: " + caughtCount, 240, 250);
     if (lastCatchTimer > 0) {
       lastCatchTimer--;
       ctx.fillText(lastCatchText, 240, 280);
     }
    
      
    linetarget = Math.max(120, midscroll);
    liney += (linetarget - liney) / 5;
    
    //i switched to making lines so it we can make this easy
	if (scroll > 305) {
        if (!inWater) {
          inWater = true;
          if (!caughtFish) {
            spawnFish();
          }
        }
        updateFishes();

    	ctx.strokeStyle = 'black';
    	ctx.lineWidth = 10;
    	ctx.beginPath();
    	ctx.moveTo(200, 120);
        ctx.lineTo(cx / 2, 305);
    	ctx.lineTo(cx / 2, liney);
    	ctx.stroke();
        ctx.strokeStyle = 'white';
        ctx.lineWidth = 7;
        ctx.stroke()
        
        ctx.strokeStyle = 'black';
    	ctx.lineWidth = 10;
        circle(cx / 2, liney + 15, 20, true, false, 0.08, 1.62, false)
        
        ctx.strokeStyle = 'gray';
    	ctx.lineWidth = 7;
        circle(cx / 2, liney + 15, 20, true, false, 0.1, 1.6, false)
        
        ctx.strokeStyle = 'black';
        
        if (!caughtFish && activeFish && Math.abs(activeFish.x - (cx / 2)) < activeFish.size + 15 && Math.abs(activeFish.y - (liney + 15)) < activeFish.size + 15) {
        	caughtFish = activeFish;
        }
    } else {
        if (caughtFish) {
          caughtCount++;
          lastCatchText = "Caught a " + caughtFish.name + ' at ' +  Math.round(caughtFish.deep) + " Depth!";
          lastCatchTimer = 180;
          caughtFish = null;
        }
    	liney = 305
        inWater = false;
        activeFish = null;
    }


     requestAnimationFrame(update);
   }   function updateFishes() {
     if (caughtFish) {
       caughtFish.x = cx / 2;
       caughtFish.y = liney + 25;
       drawFish(caughtFish);
       return;
     }

     if (!activeFish) {
       spawnFish();
       return;
     }

     activeFish.x += activeFish.speed * activeFish.dir;

     if ((activeFish.dir === 1 && activeFish.x > cx + 80) || (activeFish.dir === -1 && activeFish.x < -80) || Math.abs(activeFish.y - midscroll) > 500) {
       spawnFish();
       return;
     }

     drawFish(activeFish);
   }


   function drawFish(f) {
     ctx.save();
     ctx.translate(f.x, f.y);
     ctx.scale(f.dir, 1);

     const s = f.size;
     ctx.lineWidth = 3;
     ctx.strokeStyle = 'black';

     if (f.type === "squid") {
       ctx.strokeStyle = f.finColor;
       for (let i = -6; i <= 6; i += 4) {
         ctx.beginPath();
         ctx.moveTo(-s * 0.5, i);
         ctx.lineTo(-s * 1.4, i + Math.sin(Date.now() / 150 + i) * 4);
         ctx.stroke();
       }
       ctx.strokeStyle = 'black';
       ctx.fillStyle = f.color;
       ctx.beginPath();
       ctx.ellipse(0, 0, s, s * 0.45, 0, 0, Math.PI * 2);
       ctx.fill();
       ctx.stroke();

     } else if (f.type === "eel") {
       ctx.strokeStyle = f.color;
       ctx.lineWidth = s * 0.45;
       ctx.lineCap = "round";
       ctx.beginPath();
       ctx.moveTo(-s * 1.3, Math.sin(Date.now() / 120) * 6);
       ctx.quadraticCurveTo(-s * 0.4, -10, s * 0.8, 0);
       ctx.stroke();

     } else if (f.type === "puffer") {
       ctx.fillStyle = f.finColor;
       ctx.beginPath();
       ctx.moveTo(-s * 0.8, 0);
       ctx.lineTo(-s * 1.3, -s * 0.4);
       ctx.lineTo(-s * 1.3, s * 0.4);
       ctx.closePath();
       ctx.fill();
       ctx.stroke();

       ctx.fillStyle = f.color;
       circle(0, 0, s * 0.85, true, true);

     } else {
       ctx.fillStyle = f.finColor;
       ctx.beginPath();
       ctx.moveTo(-s * 0.8, 0);
       ctx.lineTo(-s * 1.4, -s * 0.55);
       ctx.lineTo(-s * 1.4, s * 0.55);
       ctx.closePath();
       ctx.fill();
       ctx.stroke();

       if (f.type === "shark") {
         ctx.fillStyle = f.finColor;
         ctx.beginPath();
         ctx.moveTo(-s * 0.2, -s * 0.45);
         ctx.lineTo(-s * 0.5, -s * 1.1);
         ctx.lineTo(s * 0.2, -s * 0.45);
         ctx.closePath();
         ctx.fill();
         ctx.stroke();
       }

       ctx.fillStyle = f.color;
       ctx.beginPath();
       ctx.ellipse(0, 0, s, s * 0.55, 0, 0, Math.PI * 2);
       ctx.fill();
       ctx.stroke();

       if (f.type === "striped") {
         ctx.fillStyle = "white";
         ctx.fillRect(-s * 0.15, -s * 0.5, s * 0.3, s);
       }

       if (f.type === "sword") {
         ctx.fillStyle = f.finColor;
         ctx.beginPath();
         ctx.moveTo(s * 0.9, -3);
         ctx.lineTo(s * 1.9, 0);
         ctx.lineTo(s * 0.9, 3);
         ctx.closePath();
         ctx.fill();
         ctx.stroke();
       }

       if (f.type === "angler") {
         ctx.strokeStyle = "white";
         ctx.lineWidth = 2;
         ctx.beginPath();
         ctx.moveTo(s * 0.5, -s * 0.4);
         ctx.quadraticCurveTo(s * 1.1, -s * 1.1, s * 1.3, -s * 0.5);
         ctx.stroke();

         ctx.fillStyle = "#fef08a";
         circle(s * 1.3, -s * 0.5, 5, false, true);
       }
     }

     ctx.fillStyle = "white";
     circle(s * 0.5, -s * 0.15, Math.max(3, s * 0.14), false, true);
     ctx.fillStyle = "black";
     circle(s * 0.55, -s * 0.15, Math.max(1.5, s * 0.07), false, true);

     ctx.restore();
   }
  
   update()


   let space = false;


   window.addEventListener("keydown", (event) => {
     if (event.code === "Space") {
       space = true;
     }
   });


   window.addEventListener("keyup", (event) => {
     if (event.code === "Space") {
       space = false;
     }
   });





    function drawDepth() {
     //a for loop is like repeat until but it creats a temperary variable then increases/decreases it every time it loops though
       for (let depth = 0; depth < cy; depth += 200) {
         //this is how you set the fill color
         ctx.fillStyle = "white";
           //this is how you draw text on the canvas
       ctx.fillText(depth + ' depth', 30, depth + 350);
       }
   }
  
  
  
  
   //I made a usefull function for drawing circles so that we can easaly do it in just one line
   function circle(x, y, rad, stroke = false, fill = false, start = 0, end = 2 , dir = false) {
     ctx.beginPath()
     ctx.arc(x, y, rad, start * Math.PI, end * Math.PI, dir);
       if (fill) ctx.fill()
       if (stroke) ctx.stroke()
 }
  
  
  
  
  
  
  
  
  
  
  resize()
  window.addEventListener('resize', resize, { passive: true });
   function resize() {
     canvas.width = window.innerWidth;
     canvas.height = tall;
   }
  
  
  //scrolling code (I made This For You As its very hard to do)
function updateScroll() {
 const scrollTop = window.scrollY || document.documentElement.scrollTop;
 const docHeight = document.documentElement.scrollHeight;
 const winHeight = window.innerHeight;
 const maxScroll2 = docHeight - winHeight;


 scroll = scrollTop;
 scrollProgress = maxScroll2 > 0 ? Math.min(Math.max(scrollTop / maxScroll2, 0), 1) : 0;
  maxScroll = maxScroll2
midscroll = scroll + (window.innerHeight / 2)
}





window.addEventListener('scroll', updateScroll, { passive: true });
window.addEventListener('resize', updateScroll, { passive: true });
updateScroll();
   window.addEventListener("keydown", (event) => {
     if (event.code === "KeyF") {
       if (!document.fullscreenElement) {
         document.documentElement.requestFullscreen();
       } else {
         document.exitFullscreen();
       }
     }
   });

 </script>
</body>
</html>

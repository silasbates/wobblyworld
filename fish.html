   function spawnFish() {
     const baseDepth = Math.max(950, liney);
     const targetDepth = Math.max(950, Math.min(3350, baseDepth + (Math.random() * 500 - 100)));
     const available = fishTypes.filter(f => targetDepth >= f.minDepth && targetDepth <= f.maxDepth);
     const pool = available.length > 0 ? available : [fishTypes[fishTypes.length - 1]];
const getAdjustedWeight = (f) => {
  const exponent = Math.max(0.15, 1 - (hookLuck - 0.75) * 2.5);
  return Math.pow(f.weight, exponent);
};

const totalWeight = pool.reduce((sum, f) => sum + getAdjustedWeight(f), 0);
let roll = Math.random() * totalWeight;
let chosen = pool[0];

for (let f of pool) {
  roll -= getAdjustedWeight(f);
  if (roll <= 0) {
    chosen = f;
    break;
  }
}



     const dir = Math.random() < 0.5 ? 1 : -1;
     const startX = dir === 1 ? -60 : (canvas.width || window.innerWidth) + 60;

     activeFish = {
       ...chosen,
       x: startX,
       y: targetDepth,
       dir: dir,
       deep: targetDepth - 325
     };
   }

	function sell() {
        
        for (fish of inCooler) {
        	money += fish.cost;
        }
        inCooler = []
        updateCashText()
    }
    
    updateCashText()
    function updateCashText() {

		updateText('$' + money,  'cash')
        
		updateText('$' + money,  'cash2')
        saveData('money', money)
    }
    
    
function update() {
//if (menu === 'shop') {
	//if (tall != window.innerHeight - 5) {
		//tall = window.innerHeight - 5
    	//resize()
//	} 
//} else
	if (tall != lineDist + 305 + window.innerHeight / 2) {
		tall = lineDist + 305 + window.innerHeight / 2
    	resize()
	} 
//}

  cx = canvas.width;
  cy = canvas.height;
  ctx.clearRect(0, 0, cx, cy);

  //sky
  ctx.fillStyle = 'skyblue';
  ctx.fillRect(0, 0, cx, 300);
  ctx.fillStyle = 'white';
  ctx.fillRect(0, 300, cx, 5);

  let coolersWidth = 10;
  for (let cooler of coolers) {
    if (cooler === 'small') coolersWidth += 50;
    if (cooler === 'mid') coolersWidth += 60;
    if (cooler === 'big') coolersWidth += 80;
  }

  let dockWidth = Math.max(380, coolersWidth + 90);
  let playerX = dockWidth - 80;
  let offset = playerX - 300;

  //dock
  ctx.fillStyle = 'brown';
  ctx.fillRect(1, 270, 10, 50);
  for (let px = 60; px <= dockWidth - 10; px += 60) {
    ctx.fillRect(px, 270, 10, 50);
  }
  ctx.fillRect(0, 265, dockWidth, 5);

  //player
  ctx.beginPath();
  ctx.lineWidth = 4;
  ctx.fillStyle = 'red';
  ctx.rect(playerX, 215, 50, 50);
  ctx.fill();
  ctx.stroke();

  //fishing rod
  ctx.strokeStyle = 'green';
  ctx.beginPath();
  ctx.moveTo(335 + offset, 240);
  ctx.lineTo(400 + offset, 120);
  ctx.stroke();

  ctx.strokeStyle = 'black';
  circle(370 + offset, 190, 7, true, false);
  circle(380 + offset, 170, 6, true, false);
  circle(390 + offset, 150, 5, true, false);
  circle(400 + offset, 130, 4, true, false);
  drawDepth();

  //fish coolers
  let x = 10;
  for (cooler of coolers) {
    if (cooler === 'small') {
      drawFishCooler(x, 225, 50, '#d9483b');
      x += 50;
    }
    if (cooler === 'mid') {
      drawFishCooler(x, 215, 60);
      x += 60;
    }
    if (cooler === 'big') {
      drawFishCooler(x, 199, 80, '#e6b83a');
      x += 80;
    }
  }

  ctx.font = "bold 20px sans-serif";
  ctx.fillStyle = "black";
  ctx.fillText("Caught: " + caughtCount, 240 + offset, 200);
  if (lastCatchTimer > 0) {
    lastCatchTimer--;
    ctx.fillText(lastCatchText, 400 + offset, 280);
  }

  linetarget = Math.max(120, midscroll);
  liney += (linetarget - liney) / 5;

  //i switched to making lines so it we can make this easy
  if (scroll > 305) {
    if (!inWater) {
      inWater = true;
      if (!caughtFish) {
        spawnFish();
      }
    }
    updateFishes();
    ctx.strokeStyle = 'black';
    ctx.lineWidth = 10;
    ctx.beginPath();
    ctx.moveTo(200, 120);
    ctx.lineTo(cx / 2, 305);
    ctx.lineTo(cx / 2, liney);
    ctx.stroke();

    ctx.strokeStyle = 'white';
    ctx.lineWidth = 7;
    ctx.stroke();

    ctx.strokeStyle = 'black';
    ctx.lineWidth = 10;
    circle(cx / 2, liney + 15, 20, true, false, 0.08, 1.62, false);

    ctx.strokeStyle = 'gray';
    ctx.lineWidth = 7;
    circle(cx / 2, liney + 15, 20, true, false, 0.1, 1.6, false);

    ctx.strokeStyle = 'black';
    if (!caughtFish && activeFish && Math.abs(activeFish.x - (cx / 2)) < activeFish.size + 15 && Math.abs(activeFish.y - (liney + 15)) < activeFish.size + 15) {
      caughtFish = activeFish;
      inCooler.push(caughtFish);
    }
  } else {
    if (caughtFish) {
      caughtCount++;
      lastCatchText = "Caught a " + caughtFish.name + ' at ' + Math.round(caughtFish.deep) + " Depth!";
      lastCatchTimer = 180;
      caughtFish = null;
    }
    liney = 305;
    inWater = false;
    activeFish = null;
  }

  requestAnimationFrame(update);
}
   function updateFishes() {
     if (caughtFish) {
       caughtFish.x = cx / 2;
       caughtFish.y = liney + 25;
       drawFish(caughtFish);
       return;
     }

     if (!activeFish) {
       spawnFish();
       return;
     }

     activeFish.x += activeFish.speed * activeFish.dir;

     if ((activeFish.dir === 1 && activeFish.x > cx + 80) || (activeFish.dir === -1 && activeFish.x < -80) || Math.abs(activeFish.y - midscroll) > 500) {
       spawnFish();
       return;
     }

     drawFish(activeFish);
   }


   function drawFish(f) {
     ctx.save();
     ctx.translate(f.x, f.y);
     ctx.scale(f.dir, 1);

     const s = f.size;
     ctx.lineWidth = 3;
     ctx.strokeStyle = 'black';

     if (f.type === "squid") {
       ctx.strokeStyle = f.finColor;
       for (let i = -6; i <= 6; i += 4) {
         ctx.beginPath();
         ctx.moveTo(-s * 0.5, i);
         ctx.lineTo(-s * 1.4, i + Math.sin(Date.now() / 150 + i) * 4);
         ctx.stroke();
       }
       ctx.strokeStyle = 'black';
       ctx.fillStyle = f.color;
       ctx.beginPath();
       ctx.ellipse(0, 0, s, s * 0.45, 0, 0, Math.PI * 2);
       ctx.fill();
       ctx.stroke();

     } else if (f.type === "eel") {
       ctx.strokeStyle = f.color;
       ctx.lineWidth = s * 0.45;
       ctx.lineCap = "round";
       ctx.beginPath();
       ctx.moveTo(-s * 1.3, Math.sin(Date.now() / 120) * 6);
       ctx.quadraticCurveTo(-s * 0.4, -10, s * 0.8, 0);
       ctx.stroke();

     } else if (f.type === "puffer") {
       ctx.fillStyle = f.finColor;
       ctx.beginPath();
       ctx.moveTo(-s * 0.8, 0);
       ctx.lineTo(-s * 1.3, -s * 0.4);
       ctx.lineTo(-s * 1.3, s * 0.4);
       ctx.closePath();
       ctx.fill();
       ctx.stroke();

       ctx.fillStyle = f.color;
       circle(0, 0, s * 0.85, true, true);

     } else {
       ctx.fillStyle = f.finColor;
       ctx.beginPath();
       ctx.moveTo(-s * 0.8, 0);
       ctx.lineTo(-s * 1.4, -s * 0.55);
       ctx.lineTo(-s * 1.4, s * 0.55);
       ctx.closePath();
       ctx.fill();
       ctx.stroke();

       if (f.type === "shark") {
         ctx.fillStyle = f.finColor;
         ctx.beginPath();
         ctx.moveTo(-s * 0.2, -s * 0.45);
         ctx.lineTo(-s * 0.5, -s * 1.1);
         ctx.lineTo(s * 0.2, -s * 0.45);
         ctx.closePath();
         ctx.fill();
         ctx.stroke();
       }

       ctx.fillStyle = f.color;
       ctx.beginPath();
       ctx.ellipse(0, 0, s, s * 0.55, 0, 0, Math.PI * 2);
       ctx.fill();
       ctx.stroke();

       if (f.type === "striped") {
         ctx.fillStyle = "white";
         ctx.fillRect(-s * 0.15, -s * 0.5, s * 0.3, s);
       }

       if (f.type === "sword") {
         ctx.fillStyle = f.finColor;
         ctx.beginPath();
         ctx.moveTo(s * 0.9, -3);
         ctx.lineTo(s * 1.9, 0);
         ctx.lineTo(s * 0.9, 3);
         ctx.closePath();
         ctx.fill();
         ctx.stroke();
       }

       if (f.type === "angler") {
         ctx.strokeStyle = "white";
         ctx.lineWidth = 2;
         ctx.beginPath();
         ctx.moveTo(s * 0.5, -s * 0.4);
         ctx.quadraticCurveTo(s * 1.1, -s * 1.1, s * 1.3, -s * 0.5);
         ctx.stroke();

         ctx.fillStyle = "#fef08a";
         circle(s * 1.3, -s * 0.5, 5, false, true);
       }
     }

     ctx.fillStyle = "white";
     circle(s * 0.5, -s * 0.15, Math.max(3, s * 0.14), false, true);
     ctx.fillStyle = "black";
     circle(s * 0.55, -s * 0.15, Math.max(1.5, s * 0.07), false, true);

     ctx.restore();
   }

   function circle(x, y, rad, stroke = false, fill = false, start = 0, end = 2 , dir = false) {
     ctx.beginPath()
     ctx.arc(x, y, rad, start * Math.PI, end * Math.PI, dir);
       if (fill) ctx.fill()
       if (stroke) ctx.stroke()
 }

function updateScroll() {
 const scrollTop = window.scrollY || document.documentElement.scrollTop;
 const docHeight = document.documentElement.scrollHeight;
 const winHeight = window.innerHeight;
 const maxScroll2 = docHeight - winHeight;


 scroll = scrollTop;
 scrollProgress = maxScroll2 > 0 ? Math.min(Math.max(scrollTop / maxScroll2, 0), 1) : 0;
  maxScroll = maxScroll2
midscroll = scroll + (window.innerHeight / 2)
}





window.addEventListener('scroll', updateScroll, { passive: true });
window.addEventListener('resize', updateScroll, { passive: true });
updateScroll();

function drawFishCooler(x, y, size = 50, color = '#1e6b8c') {
  const scale = size / 50;

  ctx.save();
  ctx.translate(x, y);
  ctx.scale(scale, scale);

  ctx.fillStyle = '#dce8ee';
  ctx.strokeStyle = '#13465c';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.roundRect(7, 2, 36, 12, 3);
  ctx.fill();
  ctx.stroke();

  ctx.fillStyle = '#bce6f7';
  ctx.fillRect(8, 12, 34, 8);

  ctx.save();
  ctx.translate(25, 13);
  ctx.rotate(-0.15);
  ctx.fillStyle = '#4a8fa8';
  ctx.beginPath();
  ctx.ellipse(0, 0, 11, 5, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(-10, 0);
  ctx.lineTo(-16, -5);
  ctx.lineTo(-16, 5);
  ctx.closePath();
  ctx.fill();
  ctx.restore();

  ctx.fillStyle = '#dce8ee';
  ctx.fillRect(2, 20, 4, 9);
  ctx.strokeRect(2, 20, 4, 9);
  ctx.fillRect(44, 20, 4, 9);
  ctx.strokeRect(44, 20, 4, 9);

  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.roundRect(5, 17, 40, 24, 4);
  ctx.fill();
  ctx.stroke();

  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.roundRect(4, 15, 42, 4, 2);
  ctx.fill();
  ctx.stroke();

  ctx.fillStyle = '#13465c';
  ctx.fillRect(12, 17, 3, 6);
  ctx.fillRect(35, 17, 3, 6);

  ctx.restore();
}

function saveData(key, data) {
  try {
    const jsonData = JSON.stringify(data);
    localStorage.setItem(key, jsonData);
  } catch (error) {
    console.error("Failed to save data:", error);
  }
}

function loadData(key, defaultValue = null, edit = false) {
if (edit) {
	saveData(key, edit)
}
  try {
    const savedData = localStorage.getItem(key);
    return savedData !== null ? JSON.parse(savedData) : defaultValue;
  } catch (error) {
    return defaultValue;
  }
}
